name: Build and Deploy PureXS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      # ── Validate Python decoder files ─────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python files
        run: |
          python -c "import py_compile; py_compile.compile('hb_decoder.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('purexs_decoder_cli.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('utils.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('dicom_export.py', doraise=True)"
          echo "All Python files compile cleanly"
        shell: bash

      # ── Build .NET WPF app ────────────────────────────────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish x64 (self-contained)
        run: >
          dotnet publish PureXS.WPF/PureXS.WPF.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/x64

      - name: Publish x86 (self-contained)
        run: >
          dotnet publish PureXS.WPF/PureXS.WPF.csproj
          -c Release
          -r win-x86
          --self-contained true
          -o publish/x86

      # ── Bundle Python decoder files into WPF output ───────────────────
      - name: Bundle Python decoder (x64)
        run: |
          mkdir publish\x64\decoder
          copy hb_decoder.py publish\x64\decoder\
          copy purexs_decoder_cli.py publish\x64\decoder\
          copy utils.py publish\x64\decoder\
          copy dicom_export.py publish\x64\decoder\
          copy calibration_capture.py publish\x64\decoder\
          copy requirements-decoder.txt publish\x64\decoder\requirements.txt
          if exist sidexis_tone_lut.npy copy sidexis_tone_lut.npy publish\x64\decoder\
          if exist sidexis_tone_lut_v2.npy copy sidexis_tone_lut_v2.npy publish\x64\decoder\
          if exist sidexis_tone_lut_v1.npy copy sidexis_tone_lut_v1.npy publish\x64\decoder\
          if exist sidexis_target_anchors.npy copy sidexis_target_anchors.npy publish\x64\decoder\
          if exist sgf_frame_gain.npy copy sgf_frame_gain.npy publish\x64\decoder\
        shell: cmd

      - name: Bundle Python decoder (x86)
        run: |
          mkdir publish\x86\decoder
          copy hb_decoder.py publish\x86\decoder\
          copy purexs_decoder_cli.py publish\x86\decoder\
          copy utils.py publish\x86\decoder\
          copy dicom_export.py publish\x86\decoder\
          copy calibration_capture.py publish\x86\decoder\
          copy requirements-decoder.txt publish\x86\decoder\requirements.txt
          if exist sidexis_tone_lut.npy copy sidexis_tone_lut.npy publish\x86\decoder\
          if exist sidexis_tone_lut_v2.npy copy sidexis_tone_lut_v2.npy publish\x86\decoder\
          if exist sidexis_tone_lut_v1.npy copy sidexis_tone_lut_v1.npy publish\x86\decoder\
          if exist sidexis_target_anchors.npy copy sidexis_target_anchors.npy publish\x86\decoder\
          if exist sgf_frame_gain.npy copy sgf_frame_gain.npy publish\x86\decoder\
        shell: cmd

      # ── Bundle embedded Python interpreter + decoder deps (x64 only) ──
      # Ships a self-contained Python interpreter inside the release so
      # facilities don't need internet access, admin rights, or working
      # AV/firewall config to install Python at first run. Replaces the
      # runtime-download path in SetupAndRun.bat which was failing
      # silently in the field (see purexs_2026-04-25.log, 2026-05-04.log).
      # x86 is not bundled — opencv-python no longer ships 32-bit wheels.
      - name: Bundle embedded Python (x64)
        run: |
          $ErrorActionPreference = "Stop"
          $pyVer     = "3.11.9"
          $embedZip  = "$env:RUNNER_TEMP\python-embed.zip"
          $bundleDir = "publish\x64\python"

          Write-Host "Downloading Python $pyVer embed (amd64)..."
          Invoke-WebRequest `
            -Uri "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip" `
            -OutFile $embedZip

          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          Expand-Archive -Path $embedZip -DestinationPath $bundleDir -Force

          Write-Host "Enabling site-packages in ._pth..."
          Get-ChildItem -Path $bundleDir -Filter "python*._pth" | ForEach-Object {
            (Get-Content $_.FullName) -replace '#import site','import site' |
              Set-Content $_.FullName
          }

          Write-Host "Bootstrapping pip..."
          $getPip = "$env:RUNNER_TEMP\get-pip.py"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile $getPip
          & "$bundleDir\python.exe" $getPip --no-warn-script-location

          Write-Host "Installing decoder dependencies..."
          & "$bundleDir\python.exe" -m pip install `
            -r requirements-decoder.txt `
            --no-warn-script-location `
            --no-cache-dir

          Write-Host "Verifying decoder dependencies..."
          & "$bundleDir\python.exe" -c "import numpy, cv2, PIL, scipy, pydicom; print('OK: all decoder deps importable')"
          if ($LASTEXITCODE -ne 0) {
            throw "Decoder dependency verification failed"
          }

          # Trim cache/build artifacts that aren't needed at runtime
          Get-ChildItem -Path $bundleDir -Recurse -Directory `
            -Include __pycache__,tests,_pytest |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bundleDir -Recurse -Filter "*.pyc" |
            Remove-Item -Force -ErrorAction SilentlyContinue

          Remove-Item $embedZip -Force -ErrorAction SilentlyContinue
          Remove-Item $getPip   -Force -ErrorAction SilentlyContinue

          $sizeMb = [math]::Round(
            (Get-ChildItem -Recurse $bundleDir | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Python bundle size: $sizeMb MB"
        shell: pwsh

      # ── Write version ─────────────────────────────────────────────────
      - name: Write version.txt
        run: |
          VERSION=$(date +"%Y.%m.%d")-$(echo ${{ github.sha }} | cut -c1-7)
          echo "$VERSION" > publish/x64/version.txt
          echo "$VERSION" > publish/x86/version.txt
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash

      # ── Deploy to PureXS-releases ─────────────────────────────────────
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Clone PureXS-releases
        run: |
          git clone git@github.com:${{ github.repository_owner }}/PureXS-releases.git releases-repo
        shell: bash

      - name: Stage artifacts into releases repo
        run: |
          cd releases-repo

          # Remove old binaries (keep .git, x86/, README.md, Assets/)
          # NOTE: SetupAndRun.bat is NOT excluded — CI overwrites it from source
          Get-ChildItem -Path . -Exclude '.git','x86','README.md','Assets' |
            Where-Object { $_.Name -ne '.git' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          # Remove old x86 binaries
          if (Test-Path x86) { Remove-Item x86\* -Recurse -Force -ErrorAction SilentlyContinue }

          # Copy new x64 build into root (includes decoder/ subdirectory)
          Copy-Item -Path ..\publish\x64\* -Destination . -Recurse -Force

          # Copy new x86 build into x86/ (includes decoder/ subdirectory)
          New-Item -ItemType Directory -Path x86 -Force | Out-Null
          Copy-Item -Path ..\publish\x86\* -Destination x86\ -Recurse -Force

          # Copy SetupAndRun.bat from source (single source of truth)
          Copy-Item -Path ..\SetupAndRun.bat -Destination . -Force

          # Copy releases .gitignore from source
          Copy-Item -Path ..\releases-gitignore -Destination .\.gitignore -Force
        shell: pwsh

      - name: Commit and push to PureXS-releases
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: |
          cd releases-repo
          git config user.name "PureXS CI"
          git config user.email "ci@purexs.local"
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          # Use only the first line of the source commit message (safe for shell)
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -n 1)
          git commit -m "PureXS ${VERSION} -- ${FIRST_LINE}"
          git push origin main
          echo "Deployed ${VERSION}"
        shell: bash
